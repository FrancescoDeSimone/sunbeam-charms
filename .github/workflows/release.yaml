name: Release charms

on:
  push:
    branches:
      - dev
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list:
    name: List charms
    runs-on: ubuntu-latest
    outputs:
      charms: ${{ steps.list.outputs.charms }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: List charm directories
        id: list
        run: |
          charms="$(
            git ls-files 'charms/*/charmcraft.yaml' \
              | while read -r file; do
                  if grep -q '^parts:' "$file"; then
                    printf '%s\n' "${file%/charmcraft.yaml}"
                  fi
                done \
              | jq -R -s -c '
                  split("\n")
                  | map(select(. != ""))
                  | map({name: (split("/") | join("-")), path: .})
                '
          )"
          echo "charms=$charms" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.charm.name }}
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        charm: ${{ fromJSON(needs.list.outputs.charms) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up LXD
        run: |
          for attempt in 1 2 3 4 5 6; do
            if sudo snap install lxd; then
              installed=1
              break
            fi
            sleep $((attempt * 10))
          done
          if [ "${installed:-}" != 1 ]; then
            echo "failed to install LXD" >&2
            exit 1
          fi
          sudo snap set lxd daemon.group=lxd
          sudo usermod -aG lxd "$USER"
          sudo lxd waitready
          sudo lxd init --auto
          sudo lxc config set images.compression_algorithm none
          if sudo iptables -nL DOCKER-USER >/dev/null 2>&1; then
            sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi
          if sudo ip6tables -nL DOCKER-USER >/dev/null 2>&1; then
            sudo ip6tables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo ip6tables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi

      - name: Install charmcraft
        run: |
          for attempt in 1 2 3 4 5 6; do
            if sudo snap install charmcraft --classic; then
              installed=1
              break
            fi
            sleep $((attempt * 10))
          done
          if [ "${installed:-}" != 1 ]; then
            echo "failed to install charmcraft" >&2
            exit 1
          fi

      - name: Pack charm
        working-directory: ${{ matrix.charm.path }}
        run: sg lxd -c "charmcraft pack --platform amd64 -v"

      - name: Upload charm artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.charm.name }}
          path: ${{ matrix.charm.path }}/*.charm
          if-no-files-found: error

  release:
    name: Attach charms to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download charm artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach charms to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          dist/*.charm --clobber
